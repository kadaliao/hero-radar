<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15122b">
<meta name="description" content="漫威 × DC 角色识别特训：看头像、认道具、猜剪影，答得越多画面和音乐越燃。">
<meta property="og:title" content="英雄雷达 · MARVEL × DC">
<meta property="og:description" content="看头像、认道具、猜剪影。答得越多，画面和音乐越燃。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315122b'/%3E%3Cpath d='M18 46 L30 30 L46 46 Z' fill='%23ef3d3d'/%3E%3Cpath d='M32 46 L32 30 L46 46 Z' fill='%233d7bff'/%3E%3Ccircle cx='32' cy='30' r='14' fill='%23f7f1e3' stroke='%230b0918' stroke-width='3'/%3E%3Crect x='21' y='25' width='22' height='10' rx='5' fill='%230b0918'/%3E%3Ccircle cx='27' cy='30' r='2.4' fill='%23ffd23f'/%3E%3Ccircle cx='37' cy='30' r='2.4' fill='%23ffd23f'/%3E%3Cpath d='M25 14 Q32 6 39 14 Z' fill='%23ffd23f'/%3E%3C/svg%3E">
<title>英雄雷达</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+SC:wght@400;700;900&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: one-column comic stage — a dark "ink" night, the question set as a printed paper panel, Marvel red × DC blue split accents. */
:root{
  --ink:#15122b; --ink-2:#1e1a3c; --panel:#292352; --panel-2:#342d66;
  --paper:#f7f1e3; --paper-ink:#1a1530; --edge:#0b0918;
  --muted:#a9a2cf; --pop:#ffd23f; --red:#ef3d3d; --blue:#3d7bff;
  --ok:#33d69a; --miss:#c49bff; --line:rgba(247,241,227,.16); --line-2:rgba(247,241,227,.32);
  --f-display:'ZCOOL QingKe HuangYou','Noto Sans SC','PingFang SC',system-ui,sans-serif;
  --f-body:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --f-num:'Bungee','ZCOOL QingKe HuangYou',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden}
#app.shake{animation:shake .32s}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.scr{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
.scr.play{height:100%;min-height:0;padding-block:10px 14px;gap:10px;user-select:none;-webkit-user-select:none}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:999px;line-height:1.5;white-space:nowrap}
.u-M{background:var(--red);color:#fff}
.u-D{background:var(--blue);color:#fff}
.btn{border:3px solid var(--edge);border-radius:14px;padding:12px 16px;font-weight:900;font-size:16px;background:var(--panel-2);color:var(--paper);box-shadow:4px 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.btn.primary{background:var(--pop);color:var(--paper-ink)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.ibtn{width:38px;height:38px;border-radius:12px;border:2px solid var(--line-2);background:var(--ink-2);display:grid;place-items:center;font-size:16px;flex:none}
.ibtn.off{opacity:.45;text-decoration:line-through}

/* ---------- title ---------- */
.t-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.streak{font-size:13px;color:var(--muted)}
.streak b{font-family:var(--f-num);color:var(--pop);font-size:16px;font-weight:400}
.logo{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding-block:6px 0}
.logo h1{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,15vw,76px);line-height:.95;letter-spacing:.02em;color:var(--pop);text-shadow:4px 4px 0 var(--edge),-1px -1px 0 var(--edge),1px -1px 0 var(--edge),-1px 1px 0 var(--edge)}
.logo h1 span{display:block;font-family:var(--f-num);font-size:.26em;letter-spacing:.12em;color:var(--paper);text-shadow:2px 2px 0 var(--edge);margin-top:8px}
.logo p{margin:8px 0 0;color:var(--muted);font-size:14px}
.logo .bibi{width:118px}
.mainbtns{display:grid;gap:10px}
.mainbtns .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{font-size:20px;padding:16px}
.card{background:var(--ink-2);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.card h3{font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:6px}
.quest+.quest{border-top:1px dashed var(--line)}
.qbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:900}
.quest.done .qbox{background:var(--ok);border-color:var(--ok);color:var(--paper-ink)}
.quest.done .qname{color:var(--muted);text-decoration:line-through}
.qprog{font-family:var(--f-num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qpractice{border:0;background:none;color:var(--pop);font-size:12px;padding:0;text-decoration:underline}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nav button{border:2px solid var(--line);background:var(--ink-2);border-radius:14px;padding:10px 4px;display:grid;justify-items:center;gap:2px;font-weight:700;font-size:13px}
.nav button b{font-family:var(--f-num);font-weight:400;font-size:15px;color:var(--pop)}
.foot{font-size:11px;color:var(--muted);text-align:center;opacity:.8;margin-top:auto}
.help-link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}

/* ---------- play ---------- */
.hud{display:flex;align-items:center;gap:8px}
.prog{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.prog-bar{flex:1;height:10px;border-radius:99px;background:var(--ink-2);border:2px solid var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--pop),var(--blue));transition:width .3s}
.prog span,.clock{font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock.extra{color:var(--pop);font-size:16px}
.clock.warn{color:var(--red)}
.meter{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center}
.energy{display:flex;align-items:baseline;gap:8px;min-width:0}
.energy small,.combo small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.energy b{font-family:var(--f-num);font-weight:400;font-size:28px;line-height:1;color:var(--pop);text-shadow:2px 2px 0 var(--edge);white-space:nowrap;display:inline-block}
.energy b.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.18)}}
.combo{display:grid;grid-template-columns:auto auto;column-gap:4px;align-items:baseline;opacity:.35;transition:opacity .2s}
.combo.on{opacity:1}
.combo b{font-family:var(--f-num);font-weight:400;font-size:24px;line-height:1}
.combo em{grid-column:1/-1;font-style:normal;font-size:11px;font-weight:900;color:var(--pop)}
.ctime{grid-column:1/-1;height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px;width:84px}
.ctime i{display:block;height:100%;width:0;background:var(--ok)}
.ctime.low i{background:var(--red)}
.mascot-mini .bibi{width:64px;display:block}
.qcard{background:var(--paper);color:var(--paper-ink);border:3px solid var(--edge);border-radius:18px;box-shadow:6px 6px 0 var(--edge);padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:0 1 auto;min-height:0;overflow-y:auto;position:relative;margin-top:8px}
.qcard.enter{animation:enter .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes enter{from{transform:translateY(14px) scale(.96);opacity:0}}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kchip{background:var(--paper-ink);color:var(--pop);font-size:12px;font-weight:900;padding:3px 9px;border-radius:7px;letter-spacing:.06em}
.xchip{background:var(--red);color:#fff;font-size:12px;font-weight:900;padding:3px 9px;border-radius:7px}
.rchip{background:var(--miss);color:var(--paper-ink);font-size:12px;font-weight:900;padding:3px 9px;border-radius:7px}
.qtitle{font-size:14px;font-weight:700;color:#5b5480}
.qmain{font-family:var(--f-display);font-size:clamp(34px,10vw,48px);line-height:1.12;text-wrap:balance}
.qmain.small{font-family:var(--f-body);font-weight:900;font-size:clamp(19px,5.4vw,24px);line-height:1.35}
.qsub{font-size:14px;color:#4a4368}
.sw{display:flex;gap:0;height:74px;border:3px solid var(--edge);border-radius:14px;overflow:hidden}
.sw i{flex:1}
.sw i:nth-child(1){flex:1.6}
.clues{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:c}
.clues li{counter-increment:c;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-weight:700;font-size:16px;line-height:1.4}
.clues li::before{content:counter(c);font-family:var(--f-num);font-weight:400;font-size:13px;width:24px;height:24px;border-radius:7px;background:var(--paper-ink);color:var(--pop);display:grid;place-items:center}
.clues li.off{color:#a39cbc;font-weight:400}
.clues li.off::before{background:#d8d0bd;color:#8a83a3}
.clues li.new{animation:enter .3s}
.qrow{display:flex;gap:14px;align-items:center}
.qtext{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.qart{flex:none;width:clamp(92px,28vw,124px);aspect-ratio:1}
.qart.pt{border-radius:50%;overflow:hidden;border:3px solid var(--edge);background:#efe5cf}
.qart.item{border-radius:18px;border:3px solid var(--edge);background:#fffaf0;padding:8px}
.qart.big{width:min(200px,50vw);align-self:center}
.qart.sil{border-radius:50%;overflow:hidden;border:3px solid var(--edge);background:radial-gradient(circle,#fff6cf 0 35%,#f2c12e 75%)}
.qart.reveal{animation:stampIn .45s cubic-bezier(.2,1.5,.4,1)}
.fact{display:flex;gap:10px;align-items:flex-start}
.fav{width:34px;height:34px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--edge);background:#efe5cf}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;border:0;background:none;padding:0}
.strip span{aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--edge);background:#efe5cf;box-shadow:2px 2px 0 var(--edge)}
.strip span.sil{background:radial-gradient(circle,#fff6cf 0 35%,#f2c12e 75%)}
.cx .face{display:block;aspect-ratio:1;background:#efe5cf}
.cx.locked .face{background:radial-gradient(circle,#fff6cf 0 35%,#f2c12e 75%);opacity:.85}
.cx .band{height:7px!important}
.cxhead{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.cxpt{width:120px;height:120px;border-radius:50%;overflow:hidden;border:3px solid var(--edge);background:#efe5cf;flex:none}
.cxpt.sil{background:radial-gradient(circle,#fff6cf 0 35%,#f2c12e 75%)}
.cxit{width:78px;display:grid;gap:3px;justify-items:center;text-align:center}
.cxit svg{width:72px;height:72px;background:#fffaf0;border:2px solid var(--edge);border-radius:14px;padding:5px}
.cxit small{font-size:11px;color:var(--muted);line-height:1.3}
.hintbtn{align-self:flex-start;border:2px dashed #8a83a3;background:none;color:#5b5480;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
.fact{border-top:2px dashed #cfc6b0;padding-top:8px;font-size:14px;color:#3a3358;animation:enter .3s}
.fact b{color:var(--paper-ink)}
.fact .chip{margin-right:6px;vertical-align:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none;margin-top:auto}
.opt{position:relative;border:3px solid var(--edge);border-radius:14px;background:var(--panel);box-shadow:4px 4px 0 var(--edge);min-height:66px;padding:8px 22px 8px 12px;text-align:left;display:flex;align-items:center;gap:9px;transition:transform .08s,background .15s;min-width:0}
.otx{display:flex;flex-direction:column;min-width:0}
.oav{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--edge);background:#efe5cf}
.oav svg,.qart svg,.fav svg,.cx .face svg,.strip svg,.cxpt svg,.cxit svg{display:block;width:100%;height:100%}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.opt b{font-size:17px;line-height:1.25;font-weight:900}
.opt small{font-size:11.5px;color:var(--muted);line-height:1.3}
.okey{position:absolute;right:8px;top:6px;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.opt.ng{border-style:dashed;border-color:var(--miss);background:var(--ink-2);opacity:.6;box-shadow:none;cursor:default}
.opt.ng b{text-decoration:line-through;text-decoration-color:var(--miss)}
.ngtag{position:absolute;right:8px;bottom:5px;font-style:normal;font-size:11px;font-weight:900;color:var(--miss)}
.opt.ok{background:var(--ok);color:var(--paper-ink);animation:stamp .3s}
.opt.ok small,.opt.ok .okey{color:#1e4d3a}
.opt.dim{opacity:.35}
@keyframes stamp{40%{transform:scale(1.06) rotate(-1.5deg)}}
.opts.two .opt{min-height:78px}
.opt .chip{align-self:flex-start;margin-bottom:3px}
.tapnext{text-align:center;font-size:12px;color:var(--muted);flex:none;margin-top:-4px}

/* ---------- mascot ---------- */
.bibi .e-h,.bibi .e-o,.bibi .m-h,.bibi .m-o,.bibi .b-sweat{display:none}
.bibi.cheer .e-n,.bibi.cheer .m-n,.bibi.oops .e-n,.bibi.oops .m-n{display:none}
.bibi.cheer .e-h,.bibi.cheer .m-h{display:inline}
.bibi.oops .e-o,.bibi.oops .m-o,.bibi.oops .b-sweat{display:inline}
.bibi .b-all{transform-origin:60px 126px;animation:bob 2.4s ease-in-out infinite}
.bibi.cheer .b-all{animation:jump .5s cubic-bezier(.3,1.6,.5,1)}
.bibi.oops .b-all{animation:wob .5s}
.bibi.dance:not(.cheer):not(.oops) .b-all{animation:dance .46s ease-in-out infinite alternate}
.bibi .b-armL{transform-origin:30px 76px;transition:transform .2s}
.bibi .b-armR{transform-origin:90px 76px;transition:transform .2s}
.bibi.cheer .b-armL{transform:rotate(95deg)}
.bibi.cheer .b-armR{transform:rotate(-95deg)}
.bibi .b-blip{animation:blip 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes jump{40%{transform:translateY(-16px) scale(1.04)}}
@keyframes wob{25%{transform:rotate(-9deg)}75%{transform:rotate(7deg)}}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-6px)}}
@keyframes blip{50%{opacity:.2}}

/* ---------- comic pops, toasts, banner ---------- */
#pops{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.pop{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;display:grid;place-items:center;animation:popin .9s ease-out forwards;transform:rotate(var(--rot))}
.pop svg{position:absolute;inset:0;width:100%;height:100%}
.pop span{position:relative;font-family:var(--f-num);font-size:22px;color:var(--paper-ink);letter-spacing:.02em}
@keyframes popin{0%{transform:rotate(var(--rot)) scale(.2);opacity:0}18%{transform:rotate(var(--rot)) scale(1.15);opacity:1}70%{opacity:1}100%{transform:rotate(var(--rot)) scale(1) translateY(-20px);opacity:0}}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:grid;justify-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{background:var(--paper);color:var(--paper-ink);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);border-radius:12px;padding:7px 14px;font-weight:900;font-size:14px;animation:toast 2.8s forwards;max-width:100%}
.toast small{display:block;font-weight:400;font-size:12px;color:#4a4368}
@keyframes toast{0%{transform:translateY(-14px);opacity:0}8%,85%{transform:none;opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#banner{position:fixed;left:0;right:0;top:38%;z-index:6;pointer-events:none;text-align:center}
#banner div{display:inline-block;font-family:var(--f-display);font-size:clamp(34px,10vw,54px);color:var(--pop);text-shadow:4px 4px 0 var(--edge),0 0 24px rgba(255,210,63,.5);animation:banner 1.5s forwards;padding-inline:16px}
#banner div small{display:block;font-family:var(--f-num);font-size:.36em;color:var(--paper);letter-spacing:.1em}
@keyframes banner{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}

/* ---------- result ---------- */
.res-hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;padding-top:8px}
.res-hero h2{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--muted)}
.score{font-family:var(--f-num);font-size:clamp(64px,22vw,104px);line-height:.9;color:var(--pop);text-shadow:5px 5px 0 var(--edge);animation:stampIn .5s cubic-bezier(.2,1.5,.4,1)}
.score small{font-size:.3em;color:var(--paper)}
@keyframes stampIn{from{transform:scale(2.2) rotate(-8deg);opacity:0}}
.res-hero .bibi{width:96px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--ink-2);border:2px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:2px;min-width:0}
.stat small{font-size:11px;color:var(--muted);font-weight:700}
.stat b{font-family:var(--f-num);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reslist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.reslist li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.tag{font-size:11px;font-weight:900;padding:2px 7px;border-radius:6px;background:var(--pop);color:var(--paper-ink)}
.tag.up{background:var(--ok)}
.tag.new{background:var(--blue);color:#fff}
.newcx{display:flex;flex-wrap:wrap;gap:6px}
.newcx span{border:2px solid var(--line-2);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.res-actions{position:sticky;bottom:0;display:grid;gap:8px;padding-block:10px 4px;background:linear-gradient(transparent,var(--ink) 30%)}
.res-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.extra-note{font-size:13px;color:var(--muted);text-align:center}

/* ---------- tree ---------- */
.subhead{display:flex;align-items:center;gap:10px}
.subhead h2{font-family:var(--f-display);font-weight:400;font-size:28px;flex:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:2px solid var(--line-2)}
.tree{position:relative;display:grid;gap:26px;padding-block:6px 10px}
.tlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;justify-content:center;position:relative}
.trow.c1{grid-template-columns:minmax(0,1fr);width:calc((100% - 24px)/4 + 0px);justify-self:center}
.trow.c2{grid-template-columns:repeat(2,minmax(0,1fr));width:calc((100% - 24px)/2 + 8px);justify-self:center}
.trow.c3{grid-template-columns:repeat(3,minmax(0,1fr));width:calc((100% - 24px)*3/4 + 16px);justify-self:center}
.node{position:relative;border:3px solid var(--line-2);background:var(--ink-2);border-radius:14px;padding:8px 4px 7px;display:grid;justify-items:center;gap:1px;min-width:0;text-align:center}
.node b{font-size:13px;line-height:1.25;font-weight:900}
.node small{font-size:11px;color:var(--muted)}
.node .stars{font-size:11px;color:var(--pop);letter-spacing:1px;min-height:14px}
.node.lock{opacity:.42;border-style:dashed}
.node.new{border-color:var(--pop)}
.node.new::after{content:'NEW';position:absolute;top:-9px;right:-4px;background:var(--pop);color:var(--paper-ink);font-family:var(--f-num);font-size:9px;padding:1px 5px;border-radius:6px}
.node.learn{border-color:var(--blue)}
.node.master{background:var(--pop);border-color:var(--edge);color:var(--paper-ink);box-shadow:3px 3px 0 var(--edge)}
.node.master small{color:#5b4a10}
.node.master .stars{color:var(--red)}
.node.rust{background:repeating-linear-gradient(135deg,#d9a441 0 6px,#c98d2e 6px 12px)}
.node.rust::after{content:'生锈';position:absolute;top:-9px;right:-4px;background:#8d5524;color:#fff;font-size:10px;padding:1px 5px;border-radius:6px;font-weight:900}
.rbar{height:4px;width:70%;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px}
.rbar i{display:block;height:100%;background:var(--blue)}

/* ---------- codex ---------- */
.cxbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cxbar input{flex:1 1 140px;min-width:0;background:var(--ink-2);border:2px solid var(--line-2);border-radius:12px;padding:8px 12px;color:var(--paper);font:inherit}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:2px solid var(--line-2);background:var(--ink-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.fchips button[aria-pressed="true"]{background:var(--paper);color:var(--paper-ink);border-color:var(--paper)}
.cxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cx{border:3px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--paper);color:var(--paper-ink);text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:3px 3px 0 var(--edge)}
.cx .band{display:flex}
.cx .band i{flex:1}
.cx .band i:first-child{flex:1.6}
.cx .nm{padding:6px 8px 7px;display:grid;gap:1px;min-width:0}
.cx .nm b{font-size:14px;line-height:1.25;font-weight:900;overflow-wrap:anywhere}
.cx .nm small{font-size:10.5px;color:#5b5480;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx .lv{font-size:10px;color:#8a6d00;letter-spacing:1px}
.cx.locked{background:var(--ink-2);color:var(--muted);border-color:var(--line);box-shadow:none}
.cx.locked .band{filter:grayscale(1) brightness(.45)}
.cx.locked .nm small{color:var(--muted)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:30;background:rgba(8,6,20,.72);display:grid;place-items:end center;padding-inline:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#modal .sheet{width:100%;max-width:520px;max-height:min(84vh,760px);overflow-y:auto;background:var(--ink-2);border:3px solid var(--edge);border-radius:20px;box-shadow:0 0 0 2px var(--line-2),6px 6px 0 var(--edge);padding:16px;animation:sheet .25s ease-out;display:grid;gap:12px}
@keyframes sheet{from{transform:translateY(30px);opacity:0}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:26px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .x{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-weight:700;white-space:nowrap}
.kv dd{margin:0;min-width:0}
.sheet ul{margin:0;padding-left:1.2em}
.sheet p{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line-2);background:var(--ink);border-radius:10px;padding:6px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--pop);color:var(--paper-ink);border-color:var(--pop)}
.setrow{display:grid;gap:6px}
.setrow > span{font-size:13px;color:var(--muted);font-weight:700}
.troph{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding-block:6px;border-top:1px dashed var(--line)}
.troph .medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;background:var(--ink);border:2px solid var(--line-2);color:var(--muted)}
.troph.got .medal{background:var(--pop);color:var(--paper-ink);border-color:var(--edge)}
.troph b{font-size:14px}
.troph small{display:block;font-size:12px;color:var(--muted)}
.troph .tp{font-family:var(--f-num);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bigsw{display:flex;height:42px;border-radius:10px;overflow:hidden;border:2px solid var(--edge)}
.bigsw i{flex:1}

@media (min-width:600px){
  .opt b{font-size:18px}
  .cxgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-height:640px){
  .mascot-mini .bibi{width:48px}
  .meter{grid-template-columns:1fr auto 48px}
  .opt{min-height:56px}
  .qmain{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

function portrait(id, sil = false) {

  const cover = L.cover ? COVER[L.cover[0]](p, L.cover[1]) : ['', ''];
  o.push(p(L.big ? BODY_BIG : BODY, L.suit));
  if (!sil) { for (const [t, col] of L.acc || []) o.push(ACC[t](p, col)); if (L.em) o.push(EM[L.em[0]](p, L.em[1], L.em[2])); }
  if (L.back) o.push(BACK[L.back[0]](p, L.back[1]));
  o.push(cover[0]);
  const headFill = L.head === 'full' ? L.mask : (L.head === 'skull' ? L.skull : L.skin);
  o.push(p('M51 70 L51 93 L69 93 L69 70 Z', L.head === 'skull' ? '#2b2b2b' : headFill));

  if (L.hair) o.push(HAIR[L.hair[0]](p, L.hair[1]));
  o.push(cover[1]);
  for (const [n, ...a] of L.x || []) { const f = X[n]; if (f && !(sil && f.inner)) o.push(f(p, ...a)); }
  if (!sil) { if (L.beard) o.push(BEARD[L.beard[0]](p, L.beard[1])); const [e, ec] = L.eyes || ['dot']; o.push(EYES[e](p, ec)); o.push(MOUTH[L.mouth || 'line']()); }
  // silhouettes: flood every drawn pixel with ink so no colour detail leaks through
  const g = sil ? `<filter id="silf"><feFlood flood-color="${INK}"/><feComposite in2="SourceAlpha" operator="in"/></filter><g filter="url(#silf)">${o.join('')}</g>` : o.join('');

}

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

  const near = (x, ys) => Math.min(...ys.map(y => { const p = hex2rgb(x), q = hex2rgb(y); return Math.hypot(p[0]-q[0], p[1]-q[1], p[2]-q[2]); }));

// ------------------------------------------------------------------ question generators

// ------------------------------------------------------------------ background fx

function planQueue(mode, opt) {
  const N = S.settings.count;
  if (mode === 'review') return S.review.slice(-Math.min(N, 10)).map(q => ({review:q}));
  if (mode === 'placement') return TOPO.map(id => ({skill:id}));
  if (mode === 'practice') return Array.from({length:N}, () => ({skill:opt.skill}));
  if (mode === 'uni') {
    const ids = TOPO.filter(id => !['side', 'duel'].includes(SK[id].kind));
    // easy → hard with a little jitter
    return Array.from({length:N}, (_, i) => { const pos = clamp(Math.floor((i + rnd() * 2.2) / N * ids.length), 0, ids.length - 1); return {skill:ids[pos]}; });
  }
  // "特训": review a few mastered skills, then rotate through the frontier
  const mastered = TOPO.filter(isMastered);
  const frontier = TOPO.filter(id => isUnlocked(id) && !isMastered(id)).slice(0, 4);
  const nRev = mastered.length ? Math.min(mastered.length, Math.max(1, Math.round(N * .3))) : 0;
  const rusty = rustyList();
  const revPool = [...rusty, ...shuffle(mastered.slice(-6).filter(id => !rusty.includes(id)))];
  const rev = Array.from({length:nRev}, (_, i) => revPool[i % revPool.length]);
  const main = frontier.length ? frontier : mastered;
  const rest = Array.from({length:N - nRev}, (_, i) => main[i % main.length]);
  // spread review questions through the run
  const out = rest.map(id => ({skill:id}));
  rev.forEach((id, i) => out.splice(Math.min(out.length, Math.round((i + 1) * N / (nRev + 1))), 0, {skill:id}));
  return out;
}

  if (m === 'uni') return TOPO.filter(id => !['side', 'duel'].includes(SK[id].kind)).slice(-6);

  const foe = e.foe ? (BYID[e.foe]?.zh || e.foe) : '';
  openModal(`<h2>${esc(e.zh)} ${uchip(e.u)} ${e.v ? '<span class="chip" style="background:var(--panel-2)">反派</span>' : ''}<button class="ibtn x" data-act="close" aria-label="关闭">✕</button></h2>
    <p class="muted" style="margin-top:-8px">${esc(e.en)} · 认识度 ${n >= 8 ? '★★★' : n >= 3 ? '★★' : '★'}（答对 ${n} 次）</p>
    <div class="cxhead"><span class="cxpt">${portrait(id)}</span>${e.it.map((it, k) => `<span class="cxit" title="${esc(it[0])}">${itemArt(id, k)}<small>${esc(it[0])}</small></span>`).join('')}</div>
    <div class="bigsw">${e.col.map(c => `<i style="background:${c}"></i>`).join('')}</div>
    <dl class="kv">
      ${e.real ? `<dt>真实身份</dt><dd>${esc(e.real)}</dd>` : ''}
      ${e.team ? `<dt>团队</dt><dd>${esc(TEAMS[e.team].n)}</dd>` : ''}
      ${e.home ? `<dt>地盘</dt><dd>${esc(e.home)}</dd>` : ''}
      ${foe ? `<dt>头号宿敌</dt><dd>${esc(foe)}</dd>` : ''}
      <dt>能力</dt><dd>${esc(e.pw[0])}</dd>
      ${e.it.length ? `<dt>道具</dt><dd>${e.it.map(i => `<b>${esc(i[0])}</b>：${esc(i[1])}`).join('<br>')}</dd>` : ''}
      <dt>线索</dt><dd>${e.cl.map(esc).join(' / ')}</dd>
      <dt>冷知识</dt><dd>${esc(e.fact)}</dd>
    </dl>`);
}
function trophiesSheet() {
  openModal(`<h2>成就 <span class="muted" style="font-size:16px">${Object.keys(S.trophies).length}/${TROPHIES.length}</span><button class="ibtn x" data-act="close" aria-label="关闭">✕</button></h2>
  <div>${TROPHIES.map(t => { const got = S.trophies[t.id]; const v = t.v(); const f = t.f || (x => Math.floor(x)); return `<div class="troph${got ? ' got' : ''}"><span class="medal">${got ? '★' : Math.min(99, Math.floor(clamp(v / t.t, 0, 1) * 100)) + '%'}</span><span><b>${esc(t.n)}</b><small>${esc(t.d)}${got ? ' · ' + new Date(got).toLocaleDateString('zh-CN') : ''}</small></span><span class="tp">${got ? '' : `${f(Math.min(v, t.t))}/${f(t.t)}`}</span></div>`; }).join('')}</div>`);
}
function settingsSheet() {
  const s = S.settings;
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, n]) => `<button data-act="set" data-k="${key}" data-v="${v}" aria-pressed="${String(s[key]) === String(v)}">${n}</button>`).join('')}</div>`;
  openModal(`<h2>设置<button class="ibtn x" data-act="close" aria-label="关闭">✕</button></h2>
    <div class="setrow"><span>每局题数</span>${seg('count', [[6, '6 题'], [10, '10 题'], [14, '14 题']])}</div>
    <div class="setrow"><span>音乐</span>${seg('music', [[true, '开'], [false, '关']])}</div>
    <div class="setrow"><span>音效</span>${seg('sfx', [[true, '开'], [false, '关']])}</div>
    <div class="setrow"><span>音量</span>${seg('vol', [[.35, '小'], [.7, '中'], [1, '大']])}</div>
    <div class="setrow"><span>画面动效</span>${seg('motion', [['low', '弱'], ['mid', '中'], ['high', '强（含震屏）']])}</div>
    <div class="setrow"><span>数据</span><button class="btn" data-act="reset1" style="justify-self:start">清空全部记录…</button></div>`);
}
function helpSheet() {
  openModal(`<h2>怎么玩<button class="ibtn x" data-act="close" aria-label="关闭">✕</button></h2>
  <ul>
    <li><b>四选一认角色</b>：看头像、认道具、猜剪影，再到能力、真名、宿敌……题型跟着技能树一项项解锁。</li>
    <li><b>不会结束</b>：选错只会标“差一点”，换一个再选，答对为止。全部答完就是 100 分。</li>
    <li><b>越答越燃</b>：连击越高，能量涨得越快（最高 ×2）。能量越高，背景、漫画拟声词和配乐会一层层叠上来。</li>
    <li><b>加时赛</b>：首答正确率达到 80% 可以进入 60 秒加时，第 k 题加 10+5k 分，没有上限。</li>
    <li><b>记住它</b>：答错的题进复习；答对的角色进图鉴；掌握的技能 14 天没碰会生锈。</li>
    <li>电脑上可以用数字键 1–4 作答，回车继续。</li>
  </ul>
  <button class="btn primary" data-act="close" autofocus>知道了</button>`);
}
function updateMute() { $('#mute-btn').classList.toggle('off', !S.settings.music && !S.settings.sfx); }

// ------------------------------------------------------------------ events
document.addEventListener('pointerdown', () => { AU.init(); AU.resume(); }, {once:false, passive:true});
document.addEventListener('click', e => {
  const opt = e.target.closest('#opts .opt');
  if (opt && P?.q && !P.q.done) { answer(+opt.dataset.i); return; }
  if (P?.q?.done && e.target.closest('#scr-play') && !e.target.closest('[data-act]')) { goNext(); return; }
  if (e.target === $('#modal') && $('#modal').dataset.dismiss) { closeModal(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  switch (act) {
    case 'start': startSession('adaptive'); break;
    case 'placement': startSession('placement'); break;
    case 'uni': startSession('uni', {uni:a.dataset.u}); break;
    case 'review': startSession('review'); break;
    case 'practice': closeModal(); startSession('practice', {skill:a.dataset.skill}); break;
    case 'extra': startExtra(); break;
    case 'again': { const m = P?.mode || 'adaptive', o = P?.opt || {}; startSession(m === 'review' && !S.review.length ? 'adaptive' : m === 'placement' ? 'adaptive' : m, o); break; }
    case 'home': if (P) { P = null; AU.stop(); } renderTitle(); show('scr-title'); break;
    case 'tree': renderTree(); break;
    case 'codex': renderCodex(); break;
    case 'trophies': trophiesSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'help': helpSheet(); break;
    case 'close': closeModal(); if (!S.seenHelp) { S.seenHelp = true; save(); } break;
    case 'skill': skillSheet(a.dataset.skill); break;
    case 'cx': codexSheet(a.dataset.id); break;
    case 'cxf': cxFilter = a.dataset.f; $$('.fchips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === cxFilter)); fillCodex(); break;
    case 'hint': if (P?.q && !P.q.done) { P.q.hinted = true; revealClue(P.q); } break;
    case 'mute': { const on = !(S.settings.music || S.settings.sfx); S.settings.music = on; S.settings.sfx = on; save(); updateMute(); break; }
    case 'quit':
      if (P?.extra) { finishExtra(); break; }
      openModal(`<h2>退出这一局？</h2><p>已经答过的题会保留学习记录，但这局不计分。</p><div class="mainbtns"><div class="row"><button class="btn" data-act="close" autofocus>继续答题</button><button class="btn red" data-act="quit2">退出</button></div></div>`);
      break;
    case 'quit2': closeModal(); quitSession(); break;
    case 'set': {
      const k = a.dataset.k; let v = a.dataset.v; v = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v;
      S.settings[k] = v; save(); AU.applyVol(); settingsSheet(); renderTitle();
      if (k === 'motion' && v === 'low') mascotDance(false);
      break;
    }
    case 'reset1': openModal(`<h2>清空全部记录？</h2><p>技能、图鉴、成就、复习题和设置都会被删除，无法恢复。</p><div class="mainbtns"><div class="row"><button class="btn" data-act="close" autofocus>保留</button><button class="btn red" data-act="reset2">清空</button></div></div>`); break;
    case 'reset2': try { localStorage.removeItem(KEY); } catch (err) {} S = freshState(); save(); closeModal(); renderTitle(); show('scr-title'); toast('记录已清空'); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'cx-q') { cxQuery = e.target.value; fillCodex(); } });
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape' && $('#modal').dataset.dismiss) closeModal(); return; }
  if ($('#scr-play').hidden || !P?.q) return;
  if (/^[1-4]$/.test(e.key) && !P.q.done) { answer(+e.key - 1); e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === ' ') && P.q.done) { goNext(); e.preventDefault(); }
  else if (e.key === 'Escape') $('[data-act="quit"]').click();
});
addEventListener('resize', () => { if (!$('#scr-tree').hidden) drawTreeLines(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && AU.ctx) AU.ctx.suspend(); else if (AU.ctx && AU.on) AU.ctx.resume(); });

// ------------------------------------------------------------------ boot
load();
FX.init();
renderTitle();
if (!S.seenHelp) setTimeout(helpSheet, 400);
setTimeout(checkTrophies, 600);
</script>
</body>
</html>
